<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10191b">
  <title>Updraft | StormHacks 2026</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap');

    :root {
      color-scheme: dark;
      --ink: #eef2e7;
      --muted: #a1ada5;
      --panel: #172225;
      --line: #344447;
      --mint: #9fe3bd;
      --amber: #ffd16d;
      --coral: #ff826f;
    }

    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 28px 20px 36px;
      background-color: #10191b;
      background-image: radial-gradient(ellipse at 50% 0%, #263637 0%, transparent 55%), linear-gradient(#10191b, #111719 70%);
      color: var(--ink);
      font-family: "Space Grotesk", "Trebuchet MS", sans-serif;
    }
    main { width: min(100%, 1000px); margin: 0 auto; animation: arrive 450ms ease-out both; }
    header { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 18px; }
    .eyebrow, .metric-label, .hint, .footer { font-family: "DM Mono", Consolas, monospace; }
    .eyebrow { margin: 0 0 5px; color: var(--mint); font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(25px, 5vw, 37px); line-height: 1; font-weight: 600; }
    .header-note { max-width: 290px; margin: 0 0 2px; color: var(--muted); font-size: 13px; text-align: right; }
    .hud { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; overflow: hidden; border: 1px solid var(--line); border-bottom: 0; border-radius: 7px 7px 0 0; background: var(--line); }
    .metric { min-height: 62px; padding: 11px 15px; background: var(--panel); }
    .metric-label { display: block; color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 1px; }
    .metric-value { display: block; margin-top: 3px; font-size: 19px; font-weight: 600; }
    .metric-value small { color: var(--muted); font-size: 12px; font-weight: 400; }
    .arena { position: relative; overflow: hidden; border: 1px solid var(--line); border-radius: 0 0 7px 7px; background: #172427; aspect-ratio: 960 / 600; }
    canvas { display: block; width: 100%; height: 100%; }
    .footer { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 20px; padding: 13px 2px 0; color: var(--muted); font-size: 11px; }
    .footer strong { color: var(--ink); font-weight: 500; }
    kbd { padding: 2px 5px; border: 1px solid #506064; border-radius: 3px; color: var(--ink); font: inherit; }
    @keyframes arrive { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 600px) {
      body { padding: 18px 10px 25px; }
      header { align-items: start; }
      .header-note { max-width: 145px; font-size: 11px; }
      .metric { min-height: 55px; padding: 9px 8px; }
      .metric-label { font-size: 8px; letter-spacing: .5px; }
      .metric-value { font-size: 16px; }
      .footer { font-size: 10px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div><p class="eyebrow">StormHacks 2026 · Prototype</p><h1>Updraft</h1></div>
      <p class="header-note">Clear the arena. Take the bonus. Get out before the floor catches up.</p>
    </header>
    <section class="hud" aria-label="Arena status">
      <div class="metric"><span class="metric-label">Phase</span><span class="metric-value" id="phase">Ready</span></div>
      <div class="metric"><span class="metric-label">Dots</span><span class="metric-value" id="dots">0 <small>/ 10</small></span></div>
      <div class="metric"><span class="metric-label">Credits</span><span class="metric-value" id="credits">0</span></div>
      <div class="metric"><span class="metric-label">Shield</span><span class="metric-value" id="shield">Ready</span></div>
    </section>
    <div class="arena"><canvas id="game" width="960" height="600" aria-label="Updraft platform game"></canvas></div>
    <div class="footer">
      <span><strong>Move</strong> <kbd>A</kbd> <kbd>D</kbd> / arrows &nbsp; <strong>Jump</strong> <kbd>W</kbd> <kbd>Space</kbd> / ↑</span>
      <span><strong>Dash</strong> <kbd>Shift</kbd> &nbsp; <strong>Start / continue</strong> <kbd>Enter</kbd></span>
    </div>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
